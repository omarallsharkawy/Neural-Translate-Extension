<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2.5" />

  <!-- Subtle neural grid lines -->
  <path d="M 32 44 L 64 28 L 96 44 L 96 84 L 64 100 L 32 84 Z" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Neural Connection paths -->
  <path d="M 36 48 L 64 64 M 64 64 L 92 48 M 64 64 L 64 96 M 36 80 L 64 64 M 92 80 L 64 64" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter A (English) and Ayn (Arabic) stylized or Neural Glyphs -->
  <!-- Left Side: Source Language node -->
  <circle cx="36" cy="48" r="13" fill="#0F172A" stroke="#3B82F6" stroke-width="3" />
  <text x="36" y="53" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text>

  <!-- Right Side: Target Language node (Arabic Ayn) -->
  <circle cx="92" cy="80" r="13" fill="#0F172A" stroke="#22C55E" stroke-width="3" />
  <text x="92" y="85" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Cairo', 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ع</text>

  <!-- Center Core Node (AI Engine) -->
  <circle cx="64" cy="64" r="16" fill="#0F172A" stroke="url(#glowGrad)" stroke-width="3.5" filter="url(#subtleGlow)" />
  <polygon points="64,55 71,67 57,67" fill="url(#nodeGrad)" />
  <polygon points="64,73 71,61 57,61" fill="url(#nodeGrad)" opacity="0.7" />

  <!-- Satellite Nodes -->
  <circle cx="92" cy="48" r="6" fill="#3B82F6" />
  <circle cx="36" cy="80" r="6" fill="#22C55E" />
  <circle cx="64" cy="96" r="5" fill="#38BDF8" />
</svg>
